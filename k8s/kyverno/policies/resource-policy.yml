apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: resource-security
  annotations:
    policies.kyverno.io/title: Resource Requests and Limits
    policies.kyverno.io/category: Security
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Workloads must define CPU and memory requests and limits
      to provide predictable resource allocation and prevent
      uncontrolled resource consumption.
spec:
  background: true
  validationFailureAction: Enforce

  rules:

    - name: require-resource-requests
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "CPU and memory requests are required for every container."
        pattern:
          spec:
            containers:
              - resources:
                  requests:
                    cpu: "?*"
                    memory: "?*"

    - name: require-resource-limits
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "CPU and memory limits are required for every container."
        pattern:
          spec:
            containers:
              - resources:
                  limits:
                    cpu: "?*"
                    memory: "?*"