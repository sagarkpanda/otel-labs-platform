apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-orders
spec:
  replicas: 1

  selector:
    matchLabels:
      app: python-orders

  template:
    metadata:
      labels:
        app: python-orders

    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: python-orders
          image: ghcr.io/sagarkpanda/python-orders

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

          ports:
            - containerPort: 8000