apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-orders
spec:
  replicas: 1
  selector:
    matchLabels:
      app: python-orders
  template:
    metadata:
      labels:
        app: python-orders
    spec:
      containers:
        - name: python-orders
          image: ghcr.io/sagarkpanda/python-orders

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault

          ports:
            - containerPort: 8000