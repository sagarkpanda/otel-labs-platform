name: OWASP ZAP DAST

on:
  push:
    branches:
      - main

env:
  DAST_TARGET_URL: http://otel.sagarpanda.com

permissions:
  contents: read
  # issues: write

jobs:
  zap:
    name: ZAP Full Scan
    if: github.event.head_commit.committer.username == 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check application availability
        id: check_url
        run: |
          echo "Checking ${DAST_TARGET_URL}"

          if curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --max-time 30 \
            "${DAST_TARGET_URL}" > /dev/null; then

            echo "reachable=true" >> "$GITHUB_OUTPUT"
            echo "Application is reachable."
          else
            echo "reachable=false" >> "$GITHUB_OUTPUT"
            echo "Application is not reachable. Skipping ZAP."
          fi

      - name: Run OWASP ZAP Full Scan
        if: steps.check_url.outputs.reachable == 'true'
        uses: zaproxy/action-full-scan@v0.13.0
        with:
          target: ${{ env.DAST_TARGET_URL }}
          # token: ${{ secrets.GITHUB_TOKEN }}
          # allow_issue_writing: true
          # issue_title: OWASP ZAP DAST Results
          # artifact_name: zap-dast-report
          fail_action: false