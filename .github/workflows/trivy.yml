name: Trivy Config Scan

on:
  push:
    branches: [main]
  # pull_request:
  #   branches: [main]
    paths-ignore:
      - "README.md"
      - '.github/workflows/gitleaks.yml'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  trivy-k8s:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # - name: Scan Kubernetes manifests
      #   uses: aquasecurity/trivy-action@v0.36.0
      #   with:
      #     scan-type: config
      #     scan-ref: ./k8s
      #     format: sarif
      #     output: trivy-k8s.sarif
      #     severity: HIGH,CRITICAL
      #     exit-code: 0

      - name: Scan Kubernetes manifests
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: ./k8s
          trivy-config: .trivy/config.yaml
          format: sarif
          output: trivy-k8s.sarif
          severity: HIGH,CRITICAL
          exit-code: 0

      - name: Upload Kubernetes SARIF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trivy-k8s-sarif
          path: trivy-k8s.sarif

      - name: Upload Kubernetes SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-k8s.sarif
          category: trivy-k8s

      # - name: Upload Trivy Kubernetes Results to DefectDojo
