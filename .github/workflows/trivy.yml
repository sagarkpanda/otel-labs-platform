      #   run: |
      #     curl -X POST \
      #       "${{ secrets.DEFECTDOJO_URL }}/api/v2/reimport-scan/" \
      #       -H "Authorization: Token ${{ secrets.DEFECTDOJO_API_KEY }}" \
      #       -H "Accept: application/json" \
      #       -F "scan_type=SARIF" \
      #       -F "file=@trivy-k8s.sarif" \
      #       -F "auto_create_context=true" \
      #       -F "product_type_name=SP Org" \
      #       -F "product_name=Otel Labs" \
      #       -F "engagement_name=Platform Sec Engagement" \
      #       -F "test_title=Trivy Kubernetes" \
      #       -F "close_old_findings=true" \
      #       -F "do_not_reactivate=false" \
      #       -F "environment=Lab" \
      #       -F "build_id=${{ github.run_number }}" \
      #       -F "branch_tag=${{ github.ref_name }}" \
      #       -F "commit_hash=${{ github.sha }}" \
      #       -F "tags=github-actions,trivy,kubernetes,platform,${{ github.ref_name }}"

  trivy-terraform:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Scan Terraform
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: ./terraform
          format: sarif
          output: trivy-terraform.sarif
          severity: HIGH,CRITICAL
          exit-code: 0

      - name: Upload Terraform SARIF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trivy-terraform-sarif
          path: trivy-terraform.sarif

      - name: Upload Terraform SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-terraform.sarif
          category: trivy-terraform

