# Kyverno validation test workload.
#
# Purpose:
# A small test Deployment used to validate the cluster's Kyverno policies.
#
# The securityContext and resources are intentionally explicit so individual
# settings can be enabled/disabled to demonstrate Kyverno accepting or
# rejecting the workload.
#
# This is a test workload and is not part of the main application stack.

apiVersion: apps/v1
kind: Deployment

metadata:
  name: kyverno-trigger
  namespace: otel-labs
  labels:
    app: kyverno-trigger
    purpose: kyverno-validation
    component: security-testing
    lifecycle: archived

spec:
  replicas: 1

  selector:
    matchLabels:
      app: kyverno-trigger

  template:
    metadata:
      labels:
        app: kyverno-trigger
        purpose: kyverno-validation
        component: security-testing
        lifecycle: archived

    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: kyverno-trigger
          image: ghcr.io/sagarkpanda/alpine:3.22

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true

          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
