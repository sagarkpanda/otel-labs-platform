# Falco validation workload.
#
# Purpose:
# This Deployment is used only to trigger a simple process-execution event
# inside a Kubernetes container so the custom Falco rule can be validated.
#
# It is not part of the main application/platform workloads and is kept
# under archive/ for occasional Falco testing.
#
# The image is hosted in GHCR so it satisfies the project's trusted-image
# registry policy.
#
# Kyverno security policies are intentionally satisfied by this workload;
# no special privileges or security-policy bypass are required.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: falco-trigger
  namespace: falco
  labels:
    app: falco-trigger
    purpose: falco-validation
    component: security-testing
    lifecycle: archived
spec:
  replicas: 1
  selector:
    matchLabels:
      app: falco-trigger
  template:
    metadata:
      labels:
        app: falco-trigger
        purpose: falco-validation
        component: security-testing
        lifecycle: archived
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: falco-trigger
          image: ghcr.io/sagarkpanda/alpine:3.22

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true

          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi

          command:
            - /bin/sh
            - -c
            - |
              while true; do
                sleep 3600
              done