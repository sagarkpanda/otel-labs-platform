customRules:
  custom-rules.yaml: |-
    - rule: Custom Whoami Execution
      desc: Detect whoami execution inside a container
      condition: >
        spawned_process
        and container
        and proc.name=whoami
      output: >
        CUSTOM ALERT: whoami executed in container
        | process=%proc.name
        | command=%proc.cmdline
        | container_name=%container.name
        | k8s_ns=%k8s.ns.name
        | k8s_pod_name=%k8s.pod.name
      priority: INFORMATIONAL
      tags: [custom, container, test]